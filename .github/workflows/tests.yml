name: Tests

# The engine is a library, not a deployed service (see AI_CONTEXT.md), so this is
# the gate that matters: it runs on every PR into a long-lived branch and on the
# branches themselves. Deliberately no `paths:` filter -- the tests are cheap and
# a filter here is how a workflow quietly stops covering the thing it was added
# to cover.
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.11 matches Dockerfile.sandbox. setup.py claims >=3.10, but that floor is
      # untested: the unpinned pandas/numpy in requirements.txt resolve to versions
      # that may already have dropped 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q --cov=trading_strategy_engine --cov=tsp --cov-report=term-missing
